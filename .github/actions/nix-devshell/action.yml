name: 'Nix devShell'
description: 'Install Nix, restore the Nix store cache and realise the flake devShell.'

runs:
  using: 'composite'
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      with:
        github_access_token: ${{ github.token }}

    # Keyed on the flake, so a toolchain bump in flake.lock starts a new cache. A key miss starts
    # from an empty store, fetches from cache.nixos.org, saves the new store and purges this
    # ref's older entries (purging needs `actions: write` on the job). No GC before saving:
    # nothing roots the devShell closure, so a GC would drop exactly what the cache is for.
    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        purge: true
        purge-prefixes: nix-devshell-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never

    # Every job realises the devShell, so whichever job saves the cache first saves it whole.
    - name: Realise the devShell
      shell: bash
      run: time nix develop --command true
