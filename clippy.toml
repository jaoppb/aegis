excessive-nesting-threshold = 2
too-many-lines-threshold = 25
too-many-arguments-threshold = 3
cognitive-complexity-threshold = 8
max-struct-bools = 0
max-fn-params-bools = 0
min-ident-chars-threshold = 2
allowed-idents-below-min-chars = ["'_"]
single-char-binding-names-threshold = 1
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
# `syn`: arch-lint pulls syn 3 beside syn 2. `windows-sys`: ring, in the rustls TLS stack of reqwest
# (#18), pulls 0.52 beside the 0.61 of the rest of the tree.
allowed-duplicate-crates = ["syn", "windows-sys"]
