# Hooks call just recipes only. Install with `just setup`.
pre-commit:
  parallel: true
  jobs:
    - name: fmt-check
      glob: "*.{rs,md}"
      run: just fmt-check
    - name: lint
      glob: "*.{rs,toml,lock}"
      run: just lint

pre-push:
  jobs:
    - name: check-offline
      run: just check-offline
    - name: deny-advisories
      run: just deny-advisories
    - name: issues-check
      run: just issues-check
    - name: repo-check
      run: just repo-check
