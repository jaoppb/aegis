[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "crates/cli",
    "crates/controller",
    "crates/agent",
    "tests/architecture",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jaoppb/aegis"
description = "Aegis: GitOps for Docker Compose stacks"
readme = "README.md"
keywords = ["gitops", "docker-compose", "homelab"]
categories = ["command-line-utilities"]
publish = false

[workspace.dependencies]
aegis-api = { path = "crates/api" }
aegis-domain = { path = "crates/domain" }
aegis-application = { path = "crates/application" }
aegis-adapters = { path = "crates/adapters" }
arch-lint = "=0.11.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["form", "json", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_norway = "=0.9.42"
syn = { version = "=2.0.119", features = ["extra-traits", "full", "visit"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
toml = "=1.2.3"

[workspace.lints.rust]
unused = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "forbid"
missing_docs = "forbid"
unreachable_pub = "forbid"
missing_debug_implementations = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unwrap_in_result = "forbid"
panic_in_result_fn = "forbid"
get_unwrap = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
as_conversions = "forbid"
float_arithmetic = "forbid"
arithmetic_side_effects = "forbid"
print_stdout = "forbid"
print_stderr = "forbid"
dbg_macro = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
cognitive_complexity = "forbid"
min_ident_chars = "forbid"
self_named_module_files = "forbid"
needless_pass_by_value = "forbid"
ref_option = "forbid"
