# cargo-deny policy: `just deny` (offline, part of `just check`) and `just deny-advisories` (network).
# AGENTS.md section 5 explains each rule.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "anyhow" },
    { crate = "async-trait" },
    { crate = "openssl-sys" },
]
skip = [{ crate = "syn", reason = "arch-lint pulls syn 3 beside the syn 2 the workspace pins (same exception as clippy.toml)" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
