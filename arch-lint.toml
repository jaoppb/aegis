preset = "recommended"

# Layers (inner to outer): domain <- application <- adapters <- binaries.
# Binaries only wire things together; they hold no logic of their own.

[[scopes]]
name = "api"
paths = ["crates/api/**"]

[[scopes]]
name = "domain"
paths = ["crates/domain/**"]

[[scopes]]
name = "application"
paths = ["crates/application/**"]

[[scopes]]
name = "adapters"
paths = ["crates/adapters/**"]

[[scopes]]
name = "cli"
paths = ["crates/cli/**"]

[[scopes]]
name = "controller"
paths = ["crates/controller/**"]

[[scopes]]
name = "agent"
paths = ["crates/agent/**"]

# Cross-crate edges are `aegis_*::` paths, which arch-lint's scope graph (`crate::` only) does not
# resolve, so the layering is enforced with restrict-use on those paths.
[[restrict-use]]
name = "domain-is-innermost"
scope = "domain"
deny = ["aegis_application::**", "aegis_adapters::**", "aegis_api::**", "aegis::**", "aegis_controller::**", "aegis_agent::**"]
message = "domain must not depend on any other layer"
severity = "error"

[[restrict-use]]
name = "application-depends-on-domain-only"
scope = "application"
deny = ["aegis_adapters::**", "aegis_api::**", "aegis::**", "aegis_controller::**", "aegis_agent::**"]
message = "application may depend only on domain and declares ports (traits) for adapters"
severity = "error"

[[restrict-use]]
name = "adapters-do-not-reach-binaries"
scope = "adapters"
deny = ["aegis::**", "aegis_controller::**", "aegis_agent::**"]
message = "adapters implement application ports and must not depend on binaries"
severity = "error"

# The wire types of the HTTP API depend on no other Aegis crate and on no IO or HTTP stack, so any
# client (the CLI, a future UI backend) can share them.
[[restrict-use]]
name = "api-is-wire-types-only"
scope = "api"
deny = [
    "aegis_domain::**", "aegis_application::**", "aegis_adapters::**", "aegis::**",
    "aegis_controller::**", "aegis_agent::**",
    "std::fs::**", "std::net::**", "std::process::**", "std::env::**", "std::io::**",
    "tokio::**", "reqwest::**", "hyper::**", "axum::**", "clap::**",
]
message = "the api crate holds serde wire types only: no other Aegis crate, no IO and no HTTP stack"
severity = "error"

# The binaries are bin-only crates today, so Cargo already blocks these edges; the rules are
# future-proofing for when one gains a lib target.
[[restrict-use]]
name = "cli-is-independent"
scope = "cli"
deny = ["aegis_controller::**", "aegis_agent::**"]
message = "binaries must not depend on each other"
severity = "error"

[[restrict-use]]
name = "controller-is-independent"
scope = "controller"
deny = ["aegis::**", "aegis_agent::**"]
message = "binaries must not depend on each other"
severity = "error"

[[restrict-use]]
name = "agent-is-independent"
scope = "agent"
deny = ["aegis::**", "aegis_controller::**"]
message = "binaries must not depend on each other"
severity = "error"

# The domain is pure: no IO, no CLI, no HTTP, no async runtime, no serialization wire formats.
[[restrict-use]]
name = "domain-is-pure"
scope = "domain"
deny = [
    "std::fs::**", "std::net::**", "std::process::**", "std::env::**", "std::io::**",
    "tokio::**", "reqwest::**", "hyper::**", "axum::**", "clap::**", "serde::**",
    "serde_json::**", "toml::**", "tracing::**", "git2::**",
]
message = "domain must not do IO or know about CLIs, HTTP or wire formats; put that behind a port in application and an adapter"
severity = "error"

[[restrict-use]]
name = "application-has-no-io"
scope = "application"
deny = [
    "std::fs::**", "std::net::**", "std::process::**", "std::env::**", "std::io::**",
    "tokio::process::**", "tokio::fs::**", "tokio::net::**", "reqwest::**", "hyper::**",
    "axum::**", "clap::**", "git2::**",
]
message = "application declares ports (traits); IO belongs in an adapter"
severity = "error"

# The local-checkout reader is the one place that reads files, and it is deliberately blocking: the
# loader is synchronous, and async callers wrap it in `spawn_blocking`. Everything else stays under
# the rule. Its integration test builds scratch directories the same way. The architecture checker
# is a synchronous test-time tool that reads the workspace files, and its tests read fixtures.
# `aegis validate` and `aegis diff` check that a path is a checkout before they hand it to that
# reader (`operator/checkout.rs`), a one-shot synchronous command with no async runtime in sight;
# their tests, and the command line tests, build scratch checkouts the same way.
[rules.no-sync-io]
exclude_files = [
    "crates/adapters/src/filesystem.rs",
    "crates/adapters/src/operator/checkout.rs",
    "crates/adapters/tests/filesystem.rs",
    "crates/adapters/tests/operator.rs",
    "crates/cli/tests/commands.rs",
    "tests/architecture/src/workspace.rs",
    "tests/architecture/tests/rules.rs",
]
