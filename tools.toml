[github.repository]
owner = "jaoppb"
name = "aegis"

[github.repository.settings]
allow_merge_commit = true
allow_squash_merge = false
allow_rebase_merge = false
delete_branch_on_merge = true
merge_commit_title = "PR_TITLE"
merge_commit_message = "PR_BODY"

[github.labels]
unmanaged = "error"
deprecated = [
    "bug",
    "documentation",
    "duplicate",
    "enhancement",
    "good first issue",
    "help wanted",
    "invalid",
    "question",
    "wontfix",
]
items = [
    { name = "type:feat", color = "1d76db", description = "New behaviour or capability" },
    { name = "type:fix", color = "d73a4a", description = "Something is broken" },
    { name = "type:chore", color = "8b949e", description = "Tooling, CI, housekeeping, dependencies" },
    { name = "type:docs", color = "0075ca", description = "Documentation, guides, specifications" },
    { name = "type:refactor", color = "5319e7", description = "Restructure without changing behaviour" },
    { name = "type:spike", color = "fbca04", description = "Time-boxed research that answers a question" },
    { name = "area:domain", color = "2ea44f", description = "Domain model: stacks, hosts, policies, validation" },
    { name = "area:agent", color = "5319e7", description = "Agent: per-host reconcile and Docker driving" },
    { name = "area:controller", color = "0e8a16", description = "Controller: git sync, orchestration, HTTP API" },
    { name = "area:cli", color = "1d76db", description = "aegis CLI" },
    { name = "area:secrets", color = "b60205", description = "SOPS integration and age keys" },
    { name = "area:tailscale", color = "242424", description = "Tailscale OAuth, sidecars, certs, identity" },
    { name = "area:ui", color = "e99695", description = "TypeScript web dashboard" },
    { name = "area:updates", color = "fbca04", description = "Image update detection and commit-back" },
    { name = "area:docs", color = "0075ca", description = "Documentation, guides, rules" },
    { name = "area:tooling", color = "c5def5", description = "Flake, Nix, Just, CI, Cargo workspace, repo config" },
    { name = "accessibility", color = "f143ab", description = "Barrier affecting people with disabilities" },
    { name = "skip-changelog", color = "ededed", description = "Pull request that needs no CHANGELOG.md entry" },
]

[github.milestones]
unmanaged = "error"
items = [
    { title = "v0.1.0", description = "MVP / first usable: jao-server stacks run from git through Aegis (sync, SOPS, Tailscale sidecars + ts.net HTTPS, CLI), no plaintext .env left", state = "open" },
    { title = "v0.2.0", description = "Hands-off upkeep: image updates committed back to git, safe self-upgrade, webhook sync", state = "open" },
    { title = "v0.3.0", description = "Fleet: verified multi-host operation, host enrollment, raw cert export, event history", state = "open" },
    { title = "v0.4.0", description = "Web dashboard: stable controller API contract and the TypeScript UI", state = "open" },
    { title = "v0.5.0", description = "Reach and native adapters: public ACME domains, CLI adapters replaced by native/FFI ones", state = "open" },
]

[github.issue_templates]
require_label = true
items = [
    { file = "feat.yml", label = "type:feat", title = "feat: " },
    { file = "fix.yml", label = "type:fix", title = "fix: " },
    { file = "chore.yml", label = "type:chore", title = "chore: " },
    { file = "docs.yml", label = "type:docs", title = "docs: " },
    { file = "refactor.yml", label = "type:refactor", title = "refactor: " },
    { file = "spike.yml", label = "type:spike", title = "spike: " },
]

[github.issues.rules]
cycle = true
labels = true
membership = false
milestone = true
parent = false
release = true

# Pin rules for `tools actions check`; the workflows arrive with #6.
[actions]
latest_major = true
pin_format = "sha-with-comment"
sha_matches_comment = true

# A `[github.project]` table is added by #5.

[workflow]
extends = "builtin:tools"
